<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">SkillGuardrail benchmark target allocation</title>
  <desc id="description">A target allocation of 1100 public Agent Skills across six cohorts. This is a planning target, not scan results.</desc>
  <style>
    .title { font: 700 42px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102A43; }
    .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #486075; }
    .label { font: 600 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #203040; }
    .value { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102A43; }
    .axis { font: 400 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #617386; }
    .note { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; }
  </style>
  <rect width="1600" height="900" fill="#F8FAFC"/>
  <rect x="82" y="68" width="11" height="92" rx="5" fill="#00A6A6"/>
  <text x="120" y="110" class="title">SkillGuardrail benchmark target allocation</text>
  <text x="120" y="148" class="subtitle">1,100 public Agent Skills across six cohorts</text>
  <line x1="525.0" y1="190" x2="525.0" y2="780" stroke="#D7E1EA" stroke-width="2"/><text x="525.0" y="815" text-anchor="middle" class="axis">0</text><line x1="833.3" y1="190" x2="833.3" y2="780" stroke="#D7E1EA" stroke-width="2"/><text x="833.3" y="815" text-anchor="middle" class="axis">100</text><line x1="1141.7" y1="190" x2="1141.7" y2="780" stroke="#D7E1EA" stroke-width="2"/><text x="1141.7" y="815" text-anchor="middle" class="axis">200</text><line x1="1450.0" y1="190" x2="1450.0" y2="780" stroke="#D7E1EA" stroke-width="2"/><text x="1450.0" y="815" text-anchor="middle" class="axis">300</text>
  <text x="485" y="287" text-anchor="end" class="label">Biomedical &amp; scientific research</text><rect x="525" y="250" width="863.3" height="52" rx="10" fill="#00A6A6"/><text x="1406.3" y="286" class="value">280</text><text x="485" y="382" text-anchor="end" class="label">Social science, literature &amp; academic work</text><rect x="525" y="345" width="524.2" height="52" rx="10" fill="#3487D4"/><text x="1067.2" y="381" class="value">170</text><text x="485" y="477" text-anchor="end" class="label">Software engineering &amp; DevOps</text><rect x="525" y="440" width="863.3" height="52" rx="10" fill="#6C63C9"/><text x="1406.3" y="476" class="value">280</text><text x="485" y="572" text-anchor="end" class="label">Machine learning, data &amp; AI</text><rect x="525" y="535" width="524.2" height="52" rx="10" fill="#0F9D70"/><text x="1067.2" y="571" class="value">170</text><text x="485" y="667" text-anchor="end" class="label">Quant finance &amp; economics</text><rect x="525" y="630" width="308.3" height="52" rx="10" fill="#D78922"/><text x="851.3" y="666" class="value">100</text><text x="485" y="762" text-anchor="end" class="label">Cross-domain professional automation</text><rect x="525" y="725" width="308.3" height="52" rx="10" fill="#6B7A90"/><text x="851.3" y="761" class="value">100</text>
  <text x="800" y="865" text-anchor="middle" class="note">Planning target only — not scan results, risk prevalence, or a safety rating.</text>
